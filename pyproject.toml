[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alderway-voice-agent"
version = "1.0.0"
description = "Local-first outbound home-insurance intake voice agent for LiveKit"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "livekit-agents>=1.8,<2",
  "livekit-plugins-deepgram>=1.6.10,<2",
  "livekit-plugins-google>=1.6.10,<2",
  "livekit-plugins-silero>=1.6.10,<2",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[tool.setuptools]
packages = ["alderway_voice_agent"]
package-dir = {alderway_voice_agent = "agent"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires the local Docker Compose services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
